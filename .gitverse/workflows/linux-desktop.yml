name: Linux desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".gitverse/workflows/linux-desktop.yml"
      - "desktopApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
  pull_request:
    paths:
      - ".gitverse/workflows/linux-desktop.yml"
      - "desktopApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Восстановить кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: hoshira-linux-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            hoshira-linux-gradle-

      - name: Установить инструменты упаковки
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Проверить код и собрать пакеты
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :desktopApp:test :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Сохранить Linux-пакеты
        uses: actions/upload-artifact@v4
        with:
          name: Hoshira-Linux-x64
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
